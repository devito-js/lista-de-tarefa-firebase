<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas com Firebase</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-list-check"></i> Lista de Tarefas</h1>
        <div class="input-container">
            <input type="text" id="task-input" placeholder="Adicionar nova tarefa...">
            <button id="add-task-btn"><i class="fa-solid fa-plus"></i> Adicionar</button>
        </div>
        <ul id="task-list"></ul>
    </div>

    <div id="notification-container"></div>

    <!-- Importa a configuracao primeiro -->
    <script type="module" src="config.js"></script> 
    <script type="module" src="app.js"></script>
</body>
</html>
