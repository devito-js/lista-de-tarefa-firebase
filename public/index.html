<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas com Login</title>
    <link rel="stylesheet" href="style.css?v=2"> <!-- Cache Busting Adicionado -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main id="app-container">
        <!-- TELA DE LOGIN (Visível por padrão) -->
        <div id="login-view">
            <div class="card">
                <h1>Login de Tarefas</h1>
                <p>Use suas credenciais para acessar sua lista.</p>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password">
                </div>
                <button id="login-btn">Entrar</button>
                <p id="error-message" class="error"></p>
            </div>
        </div>

        <!-- TELA DA APLICAÇÃO (Escondida por padrão) -->
        <div id="app-view" class="hidden">
            <div class="container">
                <div class="app-header">
                    <h1 id="welcome-user"></h1>
                    <button id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
                </div>
                
                <h1><i class="fa-solid fa-list-check"></i> Lista de Tarefas</h1>
                <div class="input-container">
                    <input type="text" id="task-input" placeholder="Adicionar nova tarefa...">
                    <button id="add-task-btn"><i class="fa-solid fa-plus"></i> Adicionar</button>
                </div>
                <ul id="task-list"></ul>
            </div>
        </div>
    </main>

    <div id="notification-container"></div>

    <!-- SDKs e Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script type="module" src="config.js"></script> 
    <script type="module" src="app.js?v=2"></script>

</body>
</html>
